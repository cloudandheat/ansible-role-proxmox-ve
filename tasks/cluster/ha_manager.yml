---
- name: PVE HA start Ressource Managers
  when: "inventory_hostname == _init_node and pve_cluster_ha_manager_init"
  tags: ha_managers
  block:
    - name: Check if the tracking file manager_status is already existing
      ansible.builtin.stat:
        path: "/etc/pve/ha/manager_status"
      register: _pve_cluster_ha_manager

    - name: Start the CRM + LRM Process in a non breaking way
      when: "not _pve_cluster_ha_manager.stat.exists"
      block:
        - name: Create a dummy container file
          ansible.builtin.file:
            path: "/etc/pve/nodes/{{ ansible_hostname }}/lxc/13.conf"
            state: touch
            mode: "644"

        - name: Add ct:13 to HA
          ansible.builtin.command:
            cmd: "pvesh create cluster/ha/resources --sid ct:13 --type ct"

        - name: Wait until CRM + LRM roles are elected
          ansible.builtin.command:
            cmd: "pvesh get /cluster/ha/status/manager_status -o json"
          register: _pve_ha_manager_status_elect
          until: "( _pve_ha_manager_status_elect.stdout | from_json | json_query(jquery) ) is not none"
          vars:
            jquery: "manager_status.master_node"
          retries: 5
          delay: 5

        - name: Remove ct:13 from HA
          ansible.builtin.command:
            cmd: "pvesh delete cluster/ha/resources/ct:13"

        - name: Remove a dummy container file
          ansible.builtin.file:
            path: "/etc/pve/nodes/{{ ansible_hostname }}/lxc/13.conf"
            state: absent
