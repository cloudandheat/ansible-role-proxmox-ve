---
- name: Manage Ceph MDS and CephFS
  tags: ceph_mds_fs
  block:
    - name: Normalize MDS parameter
      block:
        - name: Normalize Ceph MDS parameter into empty list if none
          ansible.builtin.set_fact:
            pve_ceph_mds_nodes: "{{ [] }}"
          when: "pve_ceph_mds_nodes is none"

        - name: Normalize Ceph MDS parameter into list of dict from list
          ansible.builtin.set_fact:
            pve_ceph_mds_nodes: "{{ pve_ceph_mds_nodes | select('mapping')
                                  + pve_ceph_mds_nodes | reject('mapping') | json_query('[].{hostname: @, name: @}') }}"
          when:
            - "pve_ceph_mds_nodes is iterable"
            - "pve_ceph_mds_nodes is not mapping"
            - "pve_ceph_mds_nodes | reject('mapping') | length > 0"

        - name: Normalize Ceph MDS parameter to include name attribute
          ansible.builtin.set_fact:
            pve_ceph_mds_nodes: "{{ pve_ceph_mds_nodes | selectattr('name', 'defined')
                                  + pve_ceph_mds_nodes | rejectattr('name', 'defined')
                                    | json_query('[].{hostname: hostname, name: hostname}') }}"
          when:
            - "pve_ceph_mds_nodes is iterable"
            - "pve_ceph_mds_nodes is not mapping"
            - "pve_ceph_mds_nodes | rejectattr('name', 'defined') | length > 0"

        - name: Initialize temporary loop var
          ansible.builtin.set_fact:
            _tmp_loop: "{{ pve_ceph_mds_nodes }}"
            pve_ceph_mds_nodes: "{{ [] }}"
          when:
            - "pve_ceph_mds_nodes is iterable"
            - "pve_ceph_mds_nodes is not mapping"

        - name: Normalize and resolve Ceph MDS parameter names and hostnames
          ansible.builtin.set_fact:
            # MDS names do not support dots and hostnames must be resolved to their inventory hostnames.
            pve_ceph_mds_nodes: "{{ (pve_ceph_mds_nodes + [{'hostname': host_name, 'name': short_name, 'fqdn': host_fqdn}]) | unique }}"
          vars:
            short_name: "{{ item.name | string | split('.') | first }}"
            # Try to resolve from ambiguous short hostname to inventory_hostname and ansible_fqdn
            host_fqdn: "{{ item_hostvars.ansible_fqdn | default(item.hostname) }}"
            host_name: "{{ item_hostvars.inventory_hostname | default(item.hostname) }}"
            item_hostvars: "{{ hostvars[_shrt2invname[item.hostname]] | default(fqdn2invname) | default({}) }}"
            # Jinja evaluates default(<expr>) even when it is not applied if it is not behind a separate variable.
            fqdn2invname: "{{ hostvars[_fqdn2invname[item.hostname]] }}"
          loop: "{{ _tmp_loop }}"
          when:
            - "pve_ceph_mds_nodes is iterable"
            - "pve_ceph_mds_nodes is not mapping"

        # This task is not actually redundant but does an extra filter step.
        - name: Collect Ceph MDS parameter nodes which are current cluster members
          ansible.builtin.set_fact:
            pve_ceph_mds_nodes: "{{ pve_ceph_mds_nodes | selectattr('hostname', 'in', groups[pve_group]) }}"
          when:
            - "pve_ceph_mds_nodes is iterable"
            - "pve_ceph_mds_nodes is not mapping"

        - name: Display normalized Ceph MDS parameter
          ansible.builtin.debug:
            msg: "pve_ceph_mds_nodes: {{ pve_ceph_mds_nodes }}"

    - name: Normalize CephFS parameter
      block:
        - name: Normalize CephFS parameter into list of dicts from list
          ansible.builtin.set_fact:
            # transform from ["value",…, {<setting>:<value>,…}] into [{'name':<value>,…, <setting>: <value>,…}]
            pve_ceph_fs: "{{ pve_ceph_fs | select('mapping') + pve_ceph_fs | reject('mapping') | json_query('[].{name: @}') }}"
          when:
            - "pve_ceph_fs is iterable"
            - "pve_ceph_fs is not mapping"
            - "pve_ceph_fs | reject('mapping') | length > 0"

        - name: Normalize CephFS parameter into list of dicts from mapping
          ansible.builtin.set_fact:
            # transform from {<name>:{<setting>: <value>, …}} into [{'name':…, <setting>: <value>, …}]
            pve_ceph_fs: "{{ pve_ceph_fs | dict2items | json_query('[].merge({name: key}, not_null(value, {name: key}))') }}"
          when: "pve_ceph_fs is mapping"

        - name: Normalize CephFS parameter into empty list if none
          ansible.builtin.set_fact:
            pve_ceph_fs: "{{ [] }}"
          when: "pve_ceph_fs is none"

        - name: Display normalized CephFS parameter
          ansible.builtin.debug:
            msg: "pve_ceph_fs: {{ pve_ceph_fs }}"

    - name: Validate parameters
      block:
        - name: Ensure each FS has a name
          ansible.builtin.assert:
            that:
              - "item.name | default(false, true) is not false"
              - "item.name is not match('^[:/\\s]+$')"
            msg: "CephFS declaration '{{ item }}' has an missing or invalid name attribute!"
          loop: "{{ pve_ceph_fs }}"

        - name: Ensure each MDS has a hostname
          ansible.builtin.assert:
            that: "item.hostname | default(false, true) is not false"
            msg: "MDS declaration '{{ item }}' must have a hostname!"
          loop: "{{ pve_ceph_mds_nodes }}"

        - name: Ensure each MDS name is valid
          ansible.builtin.assert:
            that: "item.name is match('^[a-zA-Z0-9]([a-zA-Z0-9\\-]*[a-zA-Z0-9])?$')"
            msg: "MDS declaration '{{ item }}' name is invalid. MDS name must only contain [a-zA-Z0-9] and '-' (not at start or end)!"
          loop: "{{ pve_ceph_mds_nodes }}"

        - name: Ensure MDS count is greater than FS count
          ansible.builtin.assert:
            that: "pve_ceph_fs | length <= pve_ceph_mds_nodes | length"
            msg: "There must be at least one Ceph MDS per CephFS filesystem!"

    - name: Manage Ceph MDS
      tags: ceph_mds
      block:
        - name: Prepare Ceph MDS management
          block:
            - name: Initialize variables
              ansible.builtin.set_fact:
                _ceph_undeclared_mds: "{{ [] }}"

            - name: Start MDS target service
              ansible.builtin.systemd:
                name: "ceph-mds.target"
                state: started
                enabled: true

            - name: Collect MDS metadata
              ansible.builtin.command: "ceph mds metadata --format json"
              register: _ceph_mds_metadata_raw
              changed_when: true

            - name: Normalize MDS metadata query, collect cluster members
              ansible.builtin.set_fact:
                _ceph_mds_metadata:
                  "{{ _ceph_mds_metadata_raw.stdout | from_json }}"

        - name: Collect and remove non-declared MDS
          tags: ceph_mds_remove
          block:
            - name: Read PVE Ceph conf file contents
              ansible.builtin.slurp:
                src: "/etc/pve/ceph.conf"
              register: _pve_ceph_conf_raw

            - name: Find MDS sections and missing MDS in PVE Ceph conf file
              ansible.builtin.set_fact:
                _ceph_conf_missing_mds:
                  "{{ _pve_ceph_conf_raw.content | b64decode | regex_findall('\\[mds\\.(.+)\\]')
                      | reject('in', (_ceph_mds_metadata | map(attribute='name'))) }}"

            - name: Collect non-declared MDS
              ansible.builtin.set_fact:
                _ceph_undeclared_mds: "{{ _ceph_undeclared_mds + [item] }}"
              loop: "{{ _ceph_mds_metadata }}"
              when: "pve_ceph_mds_nodes | selectattr('fqdn', '==', item.hostname) | selectattr('name', '==', item.name) | length == 0"

            - name: Ensure non-declared MDS services are stopped
              ansible.builtin.systemd:
                name: "ceph-mds@{{ item.name }}.service"
                state: stopped
                enabled: false
              loop: "{{ _ceph_undeclared_mds }}"
              loop_control:
                label: "{{ item.name }} on {{ ansible_fqdn }} ({{ inventory_hostname }})"
              # TODO FQDN test
              # NOTICE: _ceph_undeclared_mds.hostnames contains always fqdn hostnames
              when: "item.hostname == ansible_fqdn"

            - name: Destroy non-declared MDS
              ansible.builtin.command: "pveceph mds destroy {{ item.name }}"
              loop: "{{ _ceph_undeclared_mds }}"
              loop_control:
                label: "{{ item.name }} on {{ ansible_fqdn }} ({{ inventory_hostname }})"
              # NOTICE: _ceph_undeclared_mds.hostnames contains always fqdn hostnames
              when: "item.hostname == ansible_fqdn"
              changed_when: true

              # TODO command needs mds gid, extract it from "ceph mds stat"
#            - name: Remove non-declared MDS from Ceph
#              ansible.builtin.command: "ceph mds rm {{ item.name }}"
#              loop: "{{ _ceph_undeclared_mds }}"
#              loop_control:
#                label: "{{ item.name }}"
#              when: "item.hostname == ansible_fqdn"
#              changed_when: true

            - name: Ensure MDS are removed from PVE ceph conf
              ansible.builtin.ini_file:
                path: "/etc/pve/ceph.conf"
                section: "mds.{{ item }}"
                state: absent
                mode: "0640"
              loop: "{{ (_ceph_undeclared_mds | map(attribute='name')) + _ceph_conf_missing_mds }}"
              loop_control:
                label: "{{ item }}"

            - name: Ensure non-declared MDS Ceph directories are removed
              ansible.builtin.file:
                path: "/var/lib/ceph/mds/ceph-{{ item.name }}"
                state: absent
              loop: "{{ _ceph_undeclared_mds }}"
              loop_control:
                label: "{{ item.name }} on {{ ansible_fqdn }} ({{ inventory_hostname }})"
              # TODO FQDN test
              # NOTICE: _ceph_undeclared_mds.hostnames contains always fqdn hostnames
              when: "item.hostname == ansible_fqdn"

        - name: Create and start declared MDS
          tags: ceph_mds_create
          block:
            - name: Create MDS
              ansible.builtin.command: "pveceph mds create {{ item | dict2args(reject_keys=['hostname', 'fqdn']) }}"
              register: _ceph_mds_create_raws
              args:
                creates: '/var/lib/ceph/mds/ceph-{{ item.name }}'
              loop: "{{ pve_ceph_mds_nodes }}"
              changed_when: true
              when:
                - "item.name not in (_ceph_mds_metadata | map(attribute='name'))"
                # TODO FQDN TEST
                - "item.hostname == inventory_hostname"

            - name: Ensure declared MDS services are started
              ansible.builtin.systemd:
                name: "ceph-mds@{{ item.name }}.service"
                state: started
                enabled: true
              loop: "{{ pve_ceph_mds_nodes }}"
              # TODO FQDN TEST
              when: "item.hostname == inventory_hostname"

            # TODO wait for new mds to be ready
            - name: Wait for standby MDS
              ansible.builtin.command: "ceph mds stat --format json"
              register: _ceph_mds_stat_raw
              until: "(_ceph_mds_stat_raw.stdout | from_json).fsmap.standbys | default([]) | length > 0"
              when:
                - "_ceph_mds_create_raws.results | map(attribute='changed') is ansible.builtin.any"
                - "pve_ceph_fs | length < pve_ceph_mds_nodes | length"
              changed_when: false
              retries: 10
              delay: 2

    - name: Manage CephFS
      tags: ceph_fs
      when: "inventory_hostname == _ceph_init_node" # run only once per cluster
      block:
        - name: Prepare CephFS management
          block:
            - name: Recollect MDS metadata
              ansible.builtin.command: "ceph mds metadata --format json"
              register: _ceph_mds_metadata_raw
              changed_when: true

            - name: Normalize MDS metadata query, collect cluster members
              ansible.builtin.set_fact:
                _ceph_mds_metadata:
                  "{{ _ceph_mds_metadata_raw.stdout | from_json }}"

            - name: Collect existing CephFS filesystems
              ansible.builtin.command: "ceph fs ls --format json"
              register: _ceph_fs_ls_raw
              changed_when: false

            - name: Normalize CephFS filesystems query
              ansible.builtin.set_fact:
                _ceph_fs_ls: "{{ _ceph_fs_ls_raw.stdout | from_json }}"

            - name: Collect CephFS storages
              ansible.builtin.command: "pvesh get /storage --output-format json"
              register: _pvesh_get_storage_raw
              changed_when: false

            - name: Extract CephFS storage fs names
              ansible.builtin.set_fact:
                _cephfs_pve_storages:
                  # NOTICE: can fail on differently created CephFS storages, missing the 'fs-name' attribute
                  "{{ _pvesh_get_storage_raw.stdout | from_json
                    | selectattr('type', '==', 'cephfs')
                    | selectattr('fs-name', 'defined')
                    | map(attribute='storage') }}"

            - name: Collect non-declared CephFS filesystems
              ansible.builtin.set_fact:
                _undeclared_cephfs: "{{ _ceph_fs_ls | rejectattr('name', 'in', _decl_fs_names) }}"
              vars:
                _decl_fs_names: "{{ pve_ceph_fs | map(attribute='name') }}"

        - name: Collect and remove non-declared CephFS fs
          tags: ceph_fs_remove
          when: "_undeclared_cephfs | length > 0"
          block:
            - name: Disable PVE CephFS fs storage
              ansible.builtin.command: "pvesm set {{ item.name }} --disable"
              loop: "{{ _undeclared_cephfs }}"
              when: "item.name in _cephfs_pve_storages"
              changed_when: true

            # actually redundant with "pveceph --remove-storages 1"
            - name: Remove PVE CephFS fs storage configuration
              ansible.builtin.command: "pvesm remove {{ item.name }}"
              loop: "{{ _undeclared_cephfs }}"
              when: "item.name in _cephfs_pve_storages"
              changed_when: true

            - name: Stop all Ceph MDS daemons before CephFS fs removal
              ansible.builtin.systemd:
                name: "ceph-mds.target"
                state: stopped
              # TODO FQDN test
              delegate_to: "{{ hostvars[_fqdn2invname[item]].inventory_hostname | default(item) }}"
              loop: "{{ _ceph_mds_metadata | map(attribute='hostname') }}"

            - name: Unmount PVE storage CephFS fs mounts
              # NOTICE do not use "umount -l", because resource will never be freed
              ansible.builtin.command: "umount -f -t ceph /mnt/pve/{{ item[1].name }}"
              register: _storage_umount_raw
              delegate_to: "{{ item[0] }}"
              # umount is needed twice sometimes
              loop: "{{ groups[pve_group] | product(_undeclared_cephfs)
                      + groups[pve_group] | product(_undeclared_cephfs) }}"
              when: "item[1].name in _cephfs_pve_storages"
              changed_when: true
              failed_when: "_storage_umount_raw.rc not in [0, 32]" # rc 32 == already umounted
              retries: 3
              delay: 5

            - name: Destroy non-declared CephFS filesystems
              ansible.builtin.command: "pveceph fs destroy {{ item.name }} --remove-pools 1 --remove-storages 1"
              loop: "{{ _undeclared_cephfs }}"
              changed_when: true

            - name: Remove non-declared CephFS fs in Ceph
              ansible.builtin.command: "ceph fs rm {{ item.name }} --yes-i-really-mean-it"
              loop: "{{ _undeclared_cephfs }}"
              changed_when: true

            - name: Remove mount directories of storage CephFS fs mounts
              ansible.builtin.file:
                path: "/mnt/pve/{{ item[1].name }}"
                state: absent
              delegate_to: "{{ item[0] }}"
              loop: "{{ groups[pve_group] | product(_undeclared_cephfs) }}"
              timeout: 5

            - name: Start Ceph MDS after CephFS fs removal
              ansible.builtin.systemd:
                name: "ceph-mds.target"
                state: started
              # TODO FQDN test
              delegate_to: "{{ hostvars[_fqdn2invname[item]].inventory_hostname | default(item) }}"
              loop: "{{ _ceph_mds_metadata | map(attribute='hostname') }}"

        - name: Create declared CephFS filesystems
          tags: ceph_fs_create
          block:
            - name: Create CephFS filesystem
              ansible.builtin.command: "pveceph fs create {{ item | dict2args(reject_keys=['auth', 'pools', 'meta_pool']) }}"
              loop: "{{ pve_ceph_fs }}"
              changed_when: true
              when: "item.name not in (_ceph_fs_ls | map(attribute='name'))"

        - name: Modify CephFS filesystems storage definition
          tags: ceph_fs_modify
          block:
            # Disable and remove formerly storage enabled CephFS filesystems
            - name: Disable PVE CephFS fs as storage
              ansible.builtin.command: "pvesm set {{ item.name }} --disable"
              loop: "{{ pve_ceph_fs }}"
              when:
                - "item.name in _cephfs_pve_storages"
                - "_ceph_fs_ls | selectattr('name', '==', item.name) | length > 0"
                - "item['add-storage'] | default(false, true) | bool is false"
              changed_when: true

            - name: Remove PVE CephFS fs storage definition
              ansible.builtin.command: "pvesm remove {{ item.name }}"
              loop: "{{ pve_ceph_fs }}"
              when:
                - "item.name in _cephfs_pve_storages"
                - "_ceph_fs_ls | selectattr('name', '==', item.name) | length > 0"
                - "item['add-storage'] | default(false, true) | bool is false"
              changed_when: true

            - name: Unmount PVE storage CephFS mounts
              # NOTICE do not use "umount -l" because resource will never be freed
              ansible.builtin.command: "umount -f -t ceph /mnt/pve/{{ item[1].name }}"
              register: _storage_umount_raw
              delegate_to: "{{ item[0] }}"
              # umount is needed twice sometimes
              loop: "{{ groups[pve_group] | product(pve_ceph_fs)
                      + groups[pve_group] | product(pve_ceph_fs) }}"
              when:
                - "item[1].name in _cephfs_pve_storages"
                - "_ceph_fs_ls | selectattr('name', '==', item[1].name) | length > 0"
                - "item[1]['add-storage'] | default(false, true) | bool is false"
              changed_when: true
              failed_when: "_storage_umount_raw.rc not in [0, 32]" # rc 32 == already umounted
              retries: 3
              delay: 5

            - name: Remove mount directories of storage CephFS fs mounts
              ansible.builtin.file:
                path: "/mnt/pve/{{ item[1].name }}"
                state: absent
              delegate_to: "{{ item[0] }}"
              loop: "{{ groups[pve_group] | product(pve_ceph_fs) }}"
              when:
                - "item[1].name in _cephfs_pve_storages"
                - "_ceph_fs_ls | selectattr('name', '==', item[1].name) | length > 0"
                - "item[1]['add-storage'] | default(false, true) | bool is false"
              timeout: 5

            # Add and enable formerly CephFS filesystems
            - name: Enable PVE CephFS fs as storage
              ansible.builtin.command: "pvesm add cephfs {{ item.name }} --fs-name {{ item.name }} --content backup,iso,vztmpl"
              loop: "{{ pve_ceph_fs }}"
              when:
                - "item.name not in _cephfs_pve_storages"
                - "_ceph_fs_ls | selectattr('name', '==', item.name) | length > 0"
                - "item['add-storage'] | default(false, true) | bool is true"
              changed_when: true
              retries: 3
              delay: 3

        - name: Manage CephFS pools
          tags:
            - ceph_fs_modify
            - ceph_fs_pools
          when: "pve_ceph_fs | selectattr('pools', 'defined') | length > 0"
          block:
            - name: Prepare CephFS pool management
              block:
                - name: Recollect existing CephFS metadata
                  ansible.builtin.command: "ceph fs ls --format json"
                  register: _ceph_fs_ls_raw
                  changed_when: false

                - name: Normalize CephFS metadata query
                  ansible.builtin.set_fact:
                    _ceph_fs_ls: "{{ _ceph_fs_ls_raw.stdout | from_json }}"

                - name: Collect data pools for CephFS filesystems
                  ansible.builtin.set_fact:
                    # Product list of CephFS and their data pools: [[<ceph fs x>, <data pool a of ceph fs x>], …]
                    _ceph_fs_data_pools: "{{ _ceph_fs_data_pools | default([]) + [item.name] | product(item.data_pools) }}"
                  loop: "{{ _ceph_fs_ls }}"

            - name: Apply CephFS RBD pool settings
              tags: ceph_fs_pools_modify
              block:
                # TODO honour 'pg_num' attribute on pve_ceph_fs and merge with pve_ceph_fs.pools.pg_num attribute if existing and required
                - name: Set CephFS fs data pools settings
                  ansible.builtin.command:
                    "pveceph pool set {{ item[1] }} {{ pools_set | dict2args(bool2int=true, reject_keys=unsupported_args) }}"
                  vars:
                    pools_set: "{{ pve_ceph_fs | json_query(query_str) }}"
                    query_str: "[?name == '{{ item[0] }}'].pools | [0]"
                    unsupported_args: "{{ ['name', 'quota', 'application', 'add_storages', 'erasure-coding', 'config'] }}"
                  loop: "{{ _ceph_fs_data_pools }}"
                  when: "pools_set | default(false, true) is not false"
                  changed_when: true

                - name: Set CephFS fs metadata pool settings
                  ansible.builtin.command:
                    "pveceph pool set {{ item.metadata_pool }} {{ mpool_set | dict2args(bool2int=true, reject_keys=unsupported_args) }}"
                  vars:
                    mpool_set: "{{ pve_ceph_fs | json_query(query_str) }}"
                    query_str: "[?name == '{{ item.name }}'].meta_pool | [0]"
                    unsupported_args: "{{ ['name', 'quota', 'application', 'add_storages', 'erasure-coding', 'config'] }}"
                  loop: "{{ _ceph_fs_ls }}"
                  when: "mpool_set | default(false, true) is not false"
                  changed_when: true

                - name: Set CephFS fs datapool quotas
                  ansible.builtin.command: "ceph osd pool set-quota {{ item[1] }} max_bytes {{ (quota | float * 1073741824) | round | int }}"
                  vars:
                    quota: "{{ pve_ceph_fs | json_query(query_str) }}"
                    query_str: "[?name == '{{ item[0] }}'].pools.quota | [0]"
                  loop: "{{ _ceph_fs_data_pools }}"
                  loop_control:
                    label: "{{ item[0] }} ({{ item[1] }}) quota={{ (quota | float * 1073741824) | round | int }} Bytes"
                  changed_when: true

                - name: Set CephFS Ceph RBD pool config overrides
                  tags: ceph_fs_pools_config
                  block:
                    - name: Initialize variables
                      ansible.builtin.set_fact:
                        _pve_ceph_fs_pools_config: "{{ [] }}"
                        _rbd_pool_configs: "{{ [] }}"

                    - name: Normalize CephFS RBD pools config override parameters
                      block:
                        - name: Normalize CephFS RBD data pools config overrides into list of dicts from list
                          # transform {'name': <cephfs>, 'pools'.'config': [{'name': <conf name>, 'value': <conf value>}, …, {<conf name>: <conf value>}, …]}
                          # into [{'pool': <cephfs data pool x>, 'name': <conf name>, 'value': <conf value>}, …]
                          ansible.builtin.set_fact:
                            _pve_ceph_fs_pools_config: "{{ _pve_ceph_fs_pools_config
                                                         + (conf_maps_w_n_v | map('combine', {'pool': item[1]}))
                                                         + (conf_maps_other | map('dict2items', key_name='name')
                                                           | flatten | map('combine', {'pool': item[1]})) }}"
                          vars:
                            match_cephfs: "{{ pve_ceph_fs | selectattr('name', '==', item[0]) }}"
                            decl_ceph_fs: "{{ match_cephfs | first }}"
                            conf_maps: "{{ decl_ceph_fs.pools.config | default([]) | select('mapping') }}"
                            conf_maps_w_n_v: "{{ conf_maps | selectattr('name', 'defined') | selectattr('value', 'defined') }}"
                            conf_maps_other: "{{ conf_maps | rejectattr('name', 'defined') | rejectattr('value', 'defined') }}"
                          loop: "{{ _ceph_fs_data_pools }}"
                          when:
                            - "match_cephfs | length > 0"
                            - "decl_ceph_fs.pools.config | default(false, true) is iterable"

                        - name: Normalize CephFS RBD data pools config overrides into list of dicts from mapping
                          # transform {'name': <cephfs>, 'pools'.'config': {<conf name>: <conf value>, …}}
                          # into [{'pool': <cephfs data pool x>, 'name': <conf name>, 'value': <conf value>}, …]
                          ansible.builtin.set_fact:
                            _pve_ceph_fs_pools_config: "{{ _pve_ceph_fs_pools_config
                                                         + decl_ceph_fs.pools.config | dict2items(key_name='name')
                                                         | map('combine', {'pool': item[1]}) }}"
                          vars:
                            match_cephfs: "{{ pve_ceph_fs | selectattr('name', '==', item[0]) }}"
                            decl_ceph_fs: "{{ match_cephfs | first }}"
                          loop: "{{ _ceph_fs_data_pools }}"
                          when:
                            - "match_cephfs | length > 0"
                            - "decl_ceph_fs.pools.config | default(false, true) is mapping"

                        - name: Normalize CephFS RBD metadata pool config overrides into list of dicts from list
                          # transform {'name': <cephfs>, 'meta_pool'.'config': [{'name': <name>, 'value': <value>}, …, {<name>: <value>}, …]}
                          # into [{'pool': <cephfs metadata pool>, 'name': <conf name>, 'value': <conf value>}, …]
                          ansible.builtin.set_fact:
                            _pve_ceph_fs_pools_config: "{{ _pve_ceph_fs_pools_config
                                                         + (conf_maps_w_n_v | map('combine', {'pool': item.metadata_pool}))
                                                         + (conf_maps_other | map('dict2items', key_name='name')
                                                           | flatten | map('combine', {'pool': item.metadata_pool})) }}"
                          vars:
                            match_cephfs: "{{ pve_ceph_fs | selectattr('name', '==', item.name) }}"
                            decl_ceph_fs: "{{ match_cephfs | first }}"
                            conf_maps: "{{ decl_ceph_fs.meta_pool.config | default([]) | select('mapping') }}"
                            conf_maps_w_n_v: "{{ conf_maps | selectattr('name', 'defined') | selectattr('value', 'defined') }}"
                            conf_maps_other: "{{ conf_maps | rejectattr('name', 'defined') | rejectattr('value', 'defined') }}"
                          loop: "{{ _ceph_fs_ls }}"
                          when:
                            - "match_cephfs | length > 0"
                            - "decl_ceph_fs.meta_pool.config | default(false, true) is iterable"

                        - name: Normalize CephFS RBD metadata pool config overrides into list of dicts from mapping
                          # transform {'name': <cephfs>, 'meta_pool'.'config': {<conf name>: <conf value>, …}}
                          # into [{'pool': <cephfs metadata pool>, 'name': <conf name>, 'value': <conf value>}, …]
                          ansible.builtin.set_fact:
                            _pve_ceph_fs_pools_config: "{{ _pve_ceph_fs_pools_config
                                                         + decl_ceph_fs.meta_pool.config | dict2items(key_name='name')
                                                         | map('combine', {'pool': item.metadata_pool}) }}"
                          vars:
                            match_cephfs: "{{ pve_ceph_fs | selectattr('name', '==', item.name) }}"
                            decl_ceph_fs: "{{ match_cephfs | first }}"
                          loop: "{{ _ceph_fs_ls }}"
                          when:
                            - "match_cephfs | length > 0"
                            - "decl_ceph_fs.meta_pool.config | default(false, true) is mapping"

                        - name: Display normalized CephFS RBD pools config override parameter
                          ansible.builtin.debug:
                            msg: "_pve_ceph_fs_pools_config: {{ _pve_ceph_fs_pools_config }}"

                    - name: Prepare CephFS RBD pool config overrides
                      block:
                        - name: Query CephFS RBD pool config overrides
                          ansible.builtin.command: "rbd config pool ls {{ item }} --format json"
                          register: _rbd_pool_config_ls_raws
                          loop: "{{ _pve_ceph_fs_pools_config | map(attribute='pool') | unique }}"
                          changed_when: false

                        - name: Extract CephFS RBD pool config overrides
                          ansible.builtin.set_fact:
                            # _rbd_pool_configs: [{'pool': <pool>, 'name': <conf name>, 'value': <conf value>, 'source': 'pool'}, …]
                            _rbd_pool_configs: "{{ _rbd_pool_configs
                                                + item.stdout | from_json | selectattr('source', '==', 'pool') | map('combine', {'pool': item.item}) }}"
                          loop: "{{ _rbd_pool_config_ls_raws.results }}"
                          loop_control:
                            label: "{{ item.item }}"

                    - name: Set Ceph CephFS RBD config overrides
                      block:
                        - name: Set missing CephFS RBD pool config overrides
                          ansible.builtin.command: "rbd config pool set {{ item.pool }} {{ item.name }} \"{{ item.value }}\""
                          vars:
                            curr_pool_conf: "{{ _rbd_pool_configs | selectattr('pool', '==', item.pool) }}"
                          loop: "{{ _pve_ceph_fs_pools_config }}"
                          when: "curr_pool_conf | selectattr('name', '==', item.name) | selectattr('value', '==', (item.value | string)) | length == 0"
                          changed_when: true

                    - name: Remove CephFS RBD pool config overrides
                      block:
                        - name: Remove non-declared CephFS RBD pool config overrides
                          ansible.builtin.command: "rbd config pool rm {{ item.pool }} {{ item.name }}"
                          vars:
                            curr_pool_conf: "{{ _pve_ceph_fs_pools_config | selectattr('pool', '==', item.pool) }}"
                          loop: "{{ _rbd_pool_configs }}"
                          when: "curr_pool_conf | selectattr('name', '==', item.name) | length == 0"
                          changed_when: true


        # TODO find and invalidate removed auth keyrings
        - name: Manage external access to CephFS filesystems
          tags: ceph_fs_auth
          when: "pve_ceph_fs | selectattr('auth', 'defined') | length > 0"
          block:
            # TODO check and recreate keyring when permissions/caps change
            # TODO maybe adding 'osd allow rx pool={metadata_pool}' capabilities is needed
            - name: Create CephFS datapools user access
              ansible.builtin.command:
                "ceph auth get-or-create client.external.cephfs-{{ item[1] }}
                  mon 'allow r' mds 'allow {{ fs_perm }}' osd 'allow {{ fs_perm }} pool={{ item[1] }}'
                  {{ out_file }} --format json"
              register: _ext_ceph_fs_auth_raws
              vars:
                cephfs: "{{ pve_ceph_fs | selectattr('name', '==', item[0]) | first }}"
                fs_perm: "{{ (cephfs.auth.perm | default('r') == 'rw') | ternary('rw', 'r') }}"
                key_file: "{{ cephfs.auth.file | default('/tmp/cephfs_' + item[1] + '.keyring', true) }}"
                out_file: "{{ (cephfs.auth.host | default(false, true) is not false) | ternary('', '-o ' + key_file) }}"
              loop: "{{ _ceph_fs_data_pools }}"
              when: "cephfs.auth | default(false, true) is not false"
              changed_when: true

            - name: Write CephFS fs credentials to specified host
              ansible.builtin.lineinfile:
                path: "{{ key_file }}"
                line: "{{ item.stdout | from_json }}"
                state: present
                create: true
                mode: "0600"
              vars:
                cephfs: "{{ pve_ceph_fs | selectattr('name', '==', item.item[0]) | first }}"
                key_file: "{{ cephfs.auth.file | default('/tmp/cephfs_' + item.item[1] + '.keyring', true) }}"
              delegate_to: "{{ cephfs.auth.host | default('localhost', true) }}"
              loop: "{{ _ext_ceph_fs_auth_raws.results }}"
              when: "cephfs.auth.host | default(false, true) is not false"
