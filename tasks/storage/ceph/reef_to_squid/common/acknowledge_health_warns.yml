---
- name: Detect and archive crash reports
  run_once: true
  block:
    - name: List crash reports not archived so far
      ansible.builtin.command:
        cmd: "ceph crash ls-new"
      register: _ceph_crash_new_before

    - name: List found crash logs
      ansible.builtin.debug:
        msg: |
          Found the following unarchived crashlogs, trying to archive if not empty
          {{ _ceph_crash_new_before.stdout_lines }}

    - name: Determ length of crash reports
      ansible.builtin.set_fact:
        _ceph_crash_new_before_length: "{{ _ceph_crash_new_before.stdout | length | int }}"

    - name: Archive crash reports
      ansible.builtin.command:
        cmd: "ceph crash archive-all"
      when: "_ceph_crash_new_before_length > '0'"

    - name: Archive crash reports
      ansible.builtin.command:
        cmd: "ceph crash ls-new"
      register: _ceph_crash_new_after
      when: "_ceph_crash_new_before_length > '0'"

    - name: List found crash logs
      ansible.builtin.debug:
        msg: |
          Found the following crashlogs, after archiving
          {{ _ceph_crash_new_after.stdout }}
      when: "_ceph_crash_new_before_length > '0'"
