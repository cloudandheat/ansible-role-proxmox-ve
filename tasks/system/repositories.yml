- name: Manage deb822 repositories
  block:
    - name: Add Proxmox repository
      ansible.builtin.deb822_repository:
        name: proxmox
        types: deb
        uris: "{{ pve_repository.uris }}"
        suites: "{{ pve_repository.suites }}"
        components: "{{ pve_repository.components }}"
        signed_by: /etc/apt/trusted.gpg.d/proxmox-release-{{ ansible_distribution_release }}.gpg
        state: present
      register: _pve_repo

    # Even when the no-subscription version is uses, the sources for the enterprise version
    # have to be defined in disabled state here. Otherwise this file is generated by a fresh proxmox
    # installation itself and fails with access denied error. Creating this file in disabled state
    # prevents this error-case
    - name: Add Proxmox enterprise repository
      ansible.builtin.deb822_repository:
        name: pve-enterprise
        types: deb
        uris: "{{ pve_repository.uris }}"
        suites: "{{ pve_repository.suites }}"
        components: "pve-enterprise"
        signed_by: /etc/apt/trusted.gpg.d/proxmox-release-{{ ansible_distribution_release }}.gpg
        state: present
        enabled: "{{ pve_enable_enterprise_repository }}"
      register: _pve_repo

    # comes from the original repository. Not used at the moment, but maybe usedful in the future
    # to make it consistent with the pve sources
    - name: Add Proxmox Ceph repository
      ansible.builtin.deb822_repository:
        name: ceph
        types: deb
        uris: "{{ pve_ceph_repository.uris }}"
        suites: "{{ pve_ceph_repository.suites }}"
        components: "{{ pve_ceph_repository.components }}"
        signed_by: /etc/apt/trusted.gpg.d/proxmox-release-{{ ansible_distribution_release }}.gpg
        state: present
      register: _pve_ceph_repo
      when: "pve_ceph_enabled | bool"

    - name: Update repositories cache
      ansible.builtin.apt:
        update_cache: yes
      when: _pve_repo is changed or _pve_ceph_repo is changed

  when: "ansible_distribution_major_version | int > 12"

- name: Update repositories
  ansible.builtin.apt:
    update_cache: true
  when: _pve_repo is changed or _pve_ceph_repo is changed

- name: Ensure PVE enterprise repository is absent (deb822)
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    enabled: false
    state: absent
  when:
    - pve_repository.components != "pve-enterprise"
    - "ansible_distribution_major_version | int <= 12"

- name: Ensure PVE enterprise repository is absent (legacy)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/pve-enterprise.list"
    state: absent
  when:
    - pve_repository.components != "pve-enterprise"
