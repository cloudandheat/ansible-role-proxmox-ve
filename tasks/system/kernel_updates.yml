---
- name: Check for kernel update
  when: "pve_check_for_kernel_update | bool"
  block:
    - name: Collect kernel info
      collect_kernel_info:
        lookup_packages: false
      register: _pve_kernel_update

    - name: Fetch cluster status of all hosts
      ansible.builtin.command: "pvesh get cluster/status --output-format json"
      register: _cluster_status
      changed_when: false

    - name: Determine if host is already a cluster member
      ansible.builtin.set_fact:
        _is_cluster_member: "{{ _cluster_status.stdout | from_json | json_query(query_str) | length > 0 }}"
      vars:
        query_str: "[?type=='cluster']"

    - name: Reboot cluster members in serial on kernel update
      ansible.builtin.reboot:
        msg: "PVE kernel update detected by Ansible"
        pre_reboot_delay: "{{ pve_reboot_on_kernel_update_delay }}"
        post_reboot_delay: "{{ pve_reboot_on_kernel_update_delay }}"
      throttle: "{{ pve_reboot_throttle }}"
      when:
        - "_is_cluster_member"
        - "pve_reboot_on_kernel_update | bool"
        - "_pve_kernel_update.new_kernel_exists"
#        - "pve_cluster_enabled | bool"

    - name: Reboot non cluster members in parallel on kernel update
      ansible.builtin.reboot:
        msg: "PVE kernel update detected by Ansible"
        pre_reboot_delay: "{{ pve_reboot_on_kernel_update_delay }}"
        post_reboot_delay: "{{ pve_reboot_on_kernel_update_delay }}"
      when:
        - "not _is_cluster_member"
        - "pve_reboot_on_kernel_update | bool"
        - "_pve_kernel_update.new_kernel_exists"

- name: Collect kernel packages
  collect_kernel_info:
  register: _pve_kernel
  when:
    - "pve_remove_old_kernels | bool"

- name: Remove old Debian/PVE kernels
  ansible.builtin.apt:
    name: "{{ ['linux-image-amd64'] + _pve_kernel.old_packages }}"
    state: absent
    purge: true
  when:
    - "pve_remove_old_kernels | bool"
