pve_filesystems: []


### BACKUP configuration
#pve_backup_jobs: -> list[dict{
# 'all' -> bool: (Required if not vmid) Backup all known guest systems on this host.
# 'bwlimit' -> integer: Limit I/O bandwidth (in KiB/s).´
# 'comment' -> str: Description for the Job 
# 'compress' -> str=Selection('0','1','gzip','lzo','zstd'): Compress dump file, select algorithm
# 'dow' -> str= selection('mon','tue','wed','thu','fri','sat','sun'): Day of week selection (Requires)
# 'dumpdir' -> str: Store resulting files to specified directory.
# 'enabled' -> boot: Enable or disable the job.
# 'exclude' -> str: Exclude specified guest systems (assumes --all)
# 'exclude-path' -> str: Exclude certain files/directories (shell globs). Paths starting with '/' are anchored to the container's root,
#                        other paths match relative to each subdirectory.
# 'fleecing' -> dict{ 
#    enabled -> bool: enables fleecing for the job,
#    storage -> str: <storage ID> used for capturing fleece buffer 
#    }: Options for backup fleecing (VM only) 
# 'id' -> str: Job ID (will be autogenerated, if not set).
# 'ionice' -> int=range(0,8): Set IO priority when using the BFQ scheduler. For snapshot and suspend mode backups of VMs, 
#                             this only affects the compressor. A value of 8 means the idle priority is used,
#                             otherwise the best-effort priority is used with the specified value.
# 'lockwait' -> int=range(0,N): Maximal time to wait for the global lock (minutes). 
# 'mailto' -> str: Deprecated - Use notification targets/matchers instead. Comma-separated list of email addresses or users that should
#                  receive email notifications.
# 'maxfiles' -> int=range(0,N): Deprecated: use 'prune-backups' instead. Maximal number of backup files per guest system.
# 'mode' -> str=Selection('snapshot','stop','suspend'): Backup mode.
# 'notes-template' -> str: Template string for generating notes for the backup(s). It can It can contain variables
#                          which will be replaced by their values. Currently supported are {{cluster}}, {{guestname}}, {{node}},
#                          and {{vmid}}, but more might be added in the future. Needs to be a single line,
#                          newline and backslash need to be escaped as '\n' and '\\' respectively. (Requires option(s): storage)
# 'notification-mode' -> str=Selection('auto','legacy-sendmail','notification-system'): Determine which notification system to use. 
#                            If set to 'legacy-sendmail', vzdump will consider the mailto/mailnotification parameters and send emails to the
#                            specified address(es) via the 'sendmail' command. If set to 'notification-system', a notification 
#                            will be sent via PVE's notification system, and the mailto and mailnotification will be ignored. 
#                            If set to 'auto' (default setting), an email will be sent if mailto is set, and the notification
#                            system will be used if not. (defaults to = auto)
# 'pbs-change-detection-mode' -> str=Selection('data','legacy','metadata'): PBS mode used to detect file changes and switch encoding
#                                                                           format for container backups.                               
# 'performance' -> dict{
#     max-worker -> int: number of workers
#     pbs-entries-max -> int: can avoid failing backups due to a high amount of files in folders where a folder exclusion is not possible.
# }: Other performance-related settings.
# 'pigz' -> int: Use pigz instead of gzip when N>0. N=1 uses half of cores, N>1 uses N as thread count.
# 'pool' -> str: Backup all known guest systems included in the specified pool.
# 'protected' -> bool: If true, mark backup(s) as protected. (Requires option(s): storage)
# 'prune-backups' -> dict{
#   keep-all -> bool: (default)
#   keep-daily -> int: 
#   keep-hourly -> int:
#   keep-last -> int:
#   keep-monthly -> int: 
#   keep-weekly -> int:
#   keep-yearly -> int:
# }: Use these retention options instead of those from the storage configuration.
# 'quiet' -> bool: Be quiet
# 'remove' -> bool: Prune older backups according to 'prune-backups'. (defaulte=1)
# 'repeat-missed' -> bool: If true, the job will be run as soon as possible if it was missed while the scheduler was not running.
# 'schedule' -> str: Backup schedule. The format is a subset of `systemd` calendar events.
# 'script' -> str: Use specified hook script.
# 'starttime' -> str=regex('HH:MM'): Job Start time.
# 'stdexcludes' -> bool: Exclude temporary files and logs. (default=1)
# 'stop' -> bool: Stop running backup jobs on this host. (default=0)
# 'stopwait' -> int=range(0,N): Maximal time to wait until a guest system is stopped (minutes).
# 'storage' -> string: <storage ID> Store resulting file to this storage. 
# 'tmpdir' -> string: Store temporary files to specified directory.
# 'vmid' -> int=range(100,N): The ID of the guest system you want to backup.
# 'zstd' -> int: Zstd threads. N=0 uses half of the available cores, if N is set to a value bigger than 0, N is used as thread count. (default=1)
#}]: (Declarative) Defines a list of Backup jobs to be run on a regular schedule within the cluster
pve_backup_jobs: null
# pve_rollout_backup -> Optional[dict={
# 'enabled' -> bool: (default=false) Enable, to backup all virtual machines
# 'mode' -> string: (default=snapshot) Backup mode (snapshot, suspend, stop)
# 'storage -> string: (default=local) PVE-storage for the backup to use.
# }]: Configuration to make backups from all virtual machines on the host at the really start of the ansible playbook run in order to prevent dataloss for the case of a broken following rollout.
pve_rollout_backup:
  enabled: false
  mode: "snapshot"
  storage: "local"


