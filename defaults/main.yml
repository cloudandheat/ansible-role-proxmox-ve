### Ceph RBD
# pve_rbd_mirrors -> list[dict={
#  'pool' -> str: Name of (source) Ceph pool to enable mirroring for.
#  'source' -> str: Name of source Ceph cluster to mirror pool data from. Must equal an inventory group name.
#  'target' -> str: Name of target Ceph cluster to mirror pool data to. Must equal an inventory group name.
#  'create_pools' -> bool: (Optional)  !DO NOT USE THIS OPTION IN PROD! TESTING ONLY! If missing pools should be
#                          auto created with default pveceph args in source or target if they do not exist.
#                          Ceph pools must be declared in pve_ceph_pools!
#  'mode' -> str=Selection('pool', 'image'): (default='pool') RBD mirror mode.
#                          image: When configured in image mode, mirroring must be explicitly enabled on each image.
#                          pool: When configured in pool mode, all images in the pool with the journaling feature enabled are mirrored.
# TODO MW
#  'automote' -> bool: (default=false) Automatically pro-/demote images in pools.
# TODO MW
#  'state' -> str=Selection('disabled', 'reverse', 'enabled'): (default='enabled') Used primarily for disaster recovery.
#                           'disabled': Break and delete ("pause") mirror. Automatically promote images in target cluster if 'automote'==true.
#                           'reverse': (Re-)create mirror in reverse declared direction. (Re-sync source cluster pool in case of failure.)
#                           'enabled': (Re-)create mirror as declared. Automatically demote images in target cluster if 'automote'==true.
#                           IN CASE OF SOURCE CLUSTER FAILURE:
#                           It is recommended to cycle mirror states between: 'enabled' <-> 'disabled' <-> 'reverse'.
#                           Data integrity cannot be guaranteed if state is changed from 'enabled' to 'reverse' (or vice versa)
#                           because pool images must be locked as read-only at one point, thus risking loss of data.
#  'tmp_file_dir' -> str|Path: (Optional) (default='/tmp') Path to an existing (temporary) directory on tmp_file_host for caching purposes.
#  'tmp_file_host' -> str|Host: (Optional) Host for caching files (temporarily) when using this role for multiple cluster with multiple reruns.
#                               This host must therefore be reachable on any rerun of this role. ('localhost' is recommended.)
# }]: (Declarative)(ONLY if pve_ceph_enhanced_enabled) Declare one-way rbd pool mirrors between clusters.
# For bidirectional mirroring, add another entry with swapped 'source' and 'target' but same pool and mode.
pve_rbd_mirrors: []
# pve_rbd_mirror_remove -> bool: (Irreversible) If undeclared mirror pools should get removed.
pve_rbd_mirror_remove: true
# pve_remove_secondary_images -> bool: (Irreversible) If secondary images in non-declared pools should get removed.
pve_remove_secondary_images: false
# pve_rbd_journal_pool -> str: Name of journal-pool.
pve_rbd_journal_pool: "rbd-journal"
# pve_remove_secondary_images -> bool: (Irreversible) If enabled, the journal is moved to a (new) journal-pool. This shortly disalbes the mirroring of the pool.
pve_rbd_journal_migration: false

### CephFS
# pve_ceph_fs -> list[dict={
#  'name' -> str=regex(^[^:/\s]+$): (Required) The (UNIQUE!) ceph filesystem name. (No ':', '/', whitespace in name.)
#  'add-storage' -> bool: (default=false) If this FS should get added as PVE storage for this cluster.
#  'pg_num' -> int=range(8,32768): (default=128) Number of placement groups for the backing data pool. The metadata pool will use a quarter of this.
#  'pools' -> dict={(equals pve_ceph_pools dict)}: (Optional) Additional pool configuration for the CephFS data-pools.
#  'meta_pool' -> dict={(equals pve_ceph_pools dict)}: (Optional) Additional pool configuration for the CephFS metadata-pool.
#  'auth' -> dict= {
#    'perm' -> str=Selection('r', 'rw'): (default='r') Permission to grant. 'r' = read-only, 'rw' = read-write.
#    'host' -> Optional[str|host]: On which host to store the credentials.
#    'file' -> str|FilePath: (default='/tmp/cephfs_<name>.keyring') Where to store the credential file.
#  }: Generate additional external access authentication user and keys for the CephFS fs.
# } | str: Names of CephFS filesystems to create.
# ] | dict={<name>: {…}, …}: (Declarative) Which CephFS to create.
pve_ceph_fs: []

