---
### Default vars file for ansible-role-proxmox ###
### PVE Common
# pve_group -> str|list[str]: (Irreversible) Inventory group(s) of hosts to cluster together.
# NOTE: To actually enable clustering, set the corresponding variables to true.
pve_group: "{{ group_names }}"
# pve_remove_subscription_warning -> bool: (Declarative) Remove PVE no subscription warning.
pve_remove_subscription_warning: true
# pve_manage_etc_hosts -> bool: (Irreversible) If hosts file should be auto-generated with cluster hosts. (Overwriting manual changes.)
pve_manage_etc_hosts: true
# pve_hostname_rename -> Optional[str]: (Declarative) If and what hosts should get renamed to.
# Examples: "{{ ansible_hostname }}.{{ pve_domain }}" to append <pve_domain> (RECOMMENDED!)
#          "{{ inventory_hostname }}" to reset the hostname to the inventory declared one.
pve_hostname_rename: null
# pve_domain -> str: (Declarative) Domain in which the cluster hosts in hosts file should be reachable.
pve_domain: "example.test"
# pve_no_log -> bool: Suppress some ansible log output of this role.
pve_no_log: false

# NOTE: for Debian 13 deb822 repositories are used, which require a different configuration
pve_repository:
  uris: http://download.proxmox.com/debian/pve
  # suites -> str: Name of the debian distribution. For example "trixie"
  suites: "{{ ansible_distribution_release }}"
  components: pve-no-subscription
# pve_enable_enterprise_repository -> bool: Enable/Disable the enterprise-repository in Debian13/PVE9 setups
pve_enable_enterprise_repository: false

### PVEPROXY + SSL/TLS
# pve_pveproxy_defaults -> Optional dict={
# <key> -> str="viablae config key" : <value> -> str="viable config value"
# }: (Declarative)
pve_pveproxy_defaults: null
# pve_ssl_private_key -> Optional[str]: (Declarative) Content of HTTPS private key for PVE WebUI.
pve_ssl_private_key: null
# pve_ssl_certificate -> Optional[str]: (Declarative) Content of HTTPS certificate for PVE WebUI.
pve_ssl_certificate: null
# pve_disable_tls_1_2 -> bool: If TLS 1.2 should be disabled for HTTPS to the WebUI.
pve_disable_tls_1_2: false
# pve_disable_tls_1_3 -> bool: If TLS 1.3 should be disabled for HTTPS to the WebUI.
pve_disable_tls_1_3: false
# dhparam_file -> Optional[str|FilePath]: File path of Diffie-Hellmann parameters file.
dhparam_file: "/etc/ssl/dhparams.pem"
# dhparam_size -> int=range(2048,inf): Size of Diffie-Hellmann parameters in Bits. NOTE: Sizes > 2048 can take a long time to generate.
dhparam_size: 4096


### SSH settings for intra cluster communication
# pve_manage_ssh -> bool: (Irreversible) If SSH configuration and authorization should be managed by this role. (RECOMMENDED!)
pve_manage_ssh: true
# pve_ssh_port -> int=range(1, 65535): (Declarative) Port the SSH service should listen on.
pve_ssh_port: 22
# pve_ssh_key_type -> Selection[str]=('ed25519','rsa', …): (Declarative) Algorithm for SSH keys generation.
pve_ssh_key_type: "ed25519"
# pve_ssh_key_bits -> int: (Declarative) The bit-length of the SSH key to generate.
pve_ssh_key_bits: 256
# pve_ssh_additional_authorized_keys -> Optional[list[str]]: (Declarative) Additional authorized SSH keys for PVE hosts login.
pve_ssh_additional_authorized_keys: null
# pve_ssh_permit_tty -> bool: (Declarative) If interactive SSH sessions are enabled for root users between hosts.
pve_ssh_permit_tty: true
# pve_ssh_strict_include -> bool: (Declarative) Defines the sourcing rules of further SSH configuration files,
#                                 beside the requiered ones for communication within the cluster 
pve_ssh_strict_include: true
# pve_sshd_strict_include -> bool: (Declarative) Defines the sourcing rules of further SSH Daemon configuration files,
#                                  beside the requiered ones for communication within the cluster 
pve_sshd_strict_include: true


### APT Packages & Repository
# pve_manage_debian_repository -> bool: (Irreversible) If the debian OS repository mirrors should be overwritten with pve_debian_repository_lines.
pve_manage_debian_repository: true
# pve_debian_version -> str: (Declarative) The hosts debian os release name.
pve_debian_version: "bookworm"
# pve_debian_repository_lines -> list[str]: (Declarative) Debian OS apt sources list repository mirror line.
pve_debian_repository_lines:
  - "deb http://deb.debian.org/debian/ {{ pve_debian_version }} main non-free-firmware"
  - "deb-src http://deb.debian.org/debian/ {{ pve_debian_version }} main non-free-firmware"
  - "deb http://security.debian.org/debian-security {{ pve_debian_version }}-security main non-free-firmware"
  - "deb-src http://security.debian.org/debian-security {{ pve_debian_version }}-security main non-free-firmware"
  - "deb http://deb.debian.org/debian/ {{ pve_debian_version }}-updates main non-free-firmware"
  - "deb-src http://deb.debian.org/debian/ {{ pve_debian_version }}-updates main non-free-firmware"
# pve_repository_line -> str: (Declarative) PVE apt sources list repository mirror line.
# (Further information: https://pve.proxmox.com/wiki/Package_Repositories)
pve_repository_line: "deb http://download.proxmox.com/debian/pve {{ pve_debian_version }} pve-no-subscription"
# pve_ceph_repository_line -> str: (Declarative) PVE Ceph apt sources list repository mirror line.
# (Further information: https://pve.proxmox.com/wiki/Package_Repositories)
pve_ceph_repository_line: "deb http://download.proxmox.com/debian/ceph-{{ pve_ceph_default_version }} {{ pve_debian_version }} no-subscription"
# pve_extra_uninstall_packages -> list[str]: (Irreversible) Names of apt packages to remove (purge).
pve_extra_uninstall_packages: []
# pve_extra_packages -> list[str]: (Irreversible) Names of additional apt packages to install on each host.
pve_extra_packages: []
# pve_run_system_upgrades -> bool: (Declarative) Do 'unsafe' apt dist upgrades. (Recommended for PVE environments)
pve_run_system_upgrades: true
# pve_run_proxmox_upgrades -> bool: (Declarative) If Proxmox and related packages should be updated.
pve_run_proxmox_upgrades: true


### PVE Kernel
# pve_check_for_kernel_update -> bool: (Declarative) Test if a kernel update is pending.
pve_check_for_kernel_update: true
# pve_reboot_on_kernel_update -> bool: (Declarative) If host should be rebooted on pending kernel update / if kernel update should get installed.
pve_reboot_on_kernel_update: true
# pve_reboot_on_kernel_update_delay -> int: (Declarative) How long to wait before reboot.
pve_reboot_on_kernel_update_delay: 60
# pve_reboot_throttle -> int: (Declarative) number of hosts to boot in parallel
pve_reboot_throttle: 1
# pve_remove_old_kernels -> bool: (Declarative) If old kernels should be removed.
pve_remove_old_kernels: true
# pve_pin_kernel_version -> Optional[false|str]: (Declarative) If pinning, what version to pin kernel to, e.g. '1.0.1'.
pve_pin_kernel_version: "{{ pve_default_kernel_version | default(false, true) }}"
# pve_default_kernel_version -> Optional[false|str]: Same as pve_pin_kernel_version.
pve_default_kernel_version: false


### PVE User Management, Auth & Realms
# pve_realms -> dict={
# <realm> -> str:
# dict={
#  'acr-values' -> str=regex(^[^\x00-\x1F\x7F <>#"]*$): Specifies the Authentication Context Class Reference values that
#                                                       the Authorization Server is being requested to use for the Auth Request.
#  'autocreate' -> bool (default=false): Automatically create users if they do not exist.
#  'base_dn' -> str: (Required for type='ldap') LDAP base domain name.
#  'bind_dn' -> str: LDAP bind domain name.
#  'capath' -> str: (default='/etc/ssl/certs') Path to the CA certificate store.
#  'case-sensitive' -> bool: (default=true) If username is case-sensitive.
#  'cert' -> str: Path to the client certificate.
#  'certkey' -> str: Path to the client certificate key.
#  'check-connection' -> bool: (default=false) Check bind connection to the server.
#  'client-id' -> str: (Required for type='openid') OpenID Client ID.
#  'client-key' -> str: OpenID Client Key.
#  'comment' -> str: Description.
#  'default' -> bool: Use this as default realm.
#  'domain' -> str=regex(\S+): (Required for type='ad') AD domain name.
#  'filter' -> str: LDAP filter for user sync.
#  'group_classes' -> list[str]: (default=['groupOfNames', 'group', 'univentionGroup', 'ipausergroup']): The objectclasses for groups.
#  'group_dn' -> str: LDAP base domain name for group sync. If not set, the base_dn will be used.
#  'group_filter' -> str: LDAP filter for group sync.
#  'group_name_attr' -> str: LDAP attribute representing a groups name. If not set or found, the first value of the DN will be used as name.
#  'groups-autocreate' -> bool: (default=false): Automatically create groups if they do not exist.
#  'groups-claim' -> str=regex([A-Za-z0-9\.\-_]+): OpenID claim used to retrieve groups with.
#  'groups-overwrite' -> bool: (default=false): All groups will be overwritten for the user on login.
#  'issuer-url' -> str: (Required for type='openid') OpenID Issuer Url
#  'mode' -> str=Selection('ldap', 'ldap+starttls', 'ldaps'): (default='ldap') LDAP protocol mode.
#  'password' -> str: LDAP bind password. Will be stored in /etc/pve/priv/realm/<REALM>.pw.
#  'port' -> int=range(1, 65535): Server port.
#  'prompt' -> str=regex(none|login|consent|select_account|\S+): Specifies whether the Authorization Server prompts
#                                                                the End-User for reauthentication and consent.
#  'query-userinfo' -> bool: (default=true) Enables querying the userinfo endpoint for claims values.
#  'scopes' -> str: (default='email profile') Specifies the scopes (user details) that should be authorized and returned, for example email or profile.
#  'server1' -> str: (Required) Server IP address (or DNS name)
#  'server2' -> str: Fallback Server IP address (or DNS name)
#  'sslversion' -> str=Selection('tlsv1', 'tlsv1_1', 'tlsv1_2', 'tlsv1_3'): LDAPS TLS/SSL version.
#  'sync-defaults-options' ->
#    str='[enable-new=<1|0>][,full=<1|0>][,purge=<1|0>][,remove-vanished=([acl];[properties];[entry])|none][,scope=<users|groups|both>]':
#    The default options for behavior of synchronizations.
#  'sync_attributes' -> list[str=regex(\w+=[^,]+)]: List of <pve field>=<ldap attr> pairs specifying which LDAP attributes map to which PVE user field.
#                                                   For example, to map the LDAP attribute 'mail' to PVEs 'email', write email=mail.
#                                                   By default, each PVE user field is represented by an LDAP attribute of the same name.
#  'tfa' -> str='type=<TFATYPE>[,digits=<COUNT>][,id=<ID>][,key=<KEY>][,step=<SECONDS>][,url=<URL>]': Use Two-factor authentication.
#  'type' -> str=Selection('ad', 'ldap', 'openid', 'pam', 'pve'): (Required) Realm type.
#  'user_attr' -> str=regex(\S{2,}): (Required for type='ldap') LDAP user attribute name. ('uid' or 'sAMAccountName' in most cases.)
#  'user_classes' -> list[str]: (default=['inetorgperson', 'posixaccount', 'person', 'user']): The objectclasses for users.
#  'username-claim' -> str: OpenID claim used to generate the unique username.
#  'verify' -> bool: (default=false) Verify the server’s SSL certificate
#  'sync' -> dict = {
#   'dry-run' -> bool: (default=false) If set, does not write anything.
#   'enable-new' -> bool: (default=true): Enable newly synced users immediately.
#   'remove-vanished' -> str=Selection('[acl;][properties;][entry]', 'none'): (default='none')
#                        A semicolon-separated list of things to remove when they or the user vanishes during a sync.
#                        The following values are possible:
#                        'acl' removes acls when the user/group is not returned from the sync. Instead of a list it also can be 'none' (the default).
#                        'properties' removes the set properties on existing user/group that do not appear in the source (even custom ones).
#                        'entry' removes the user/group when not returned from the sync.
#   'scope' -> str=Selection('both', 'groups', 'users'): (Required) Select what to sync.
#  }: Declare a realm sync that should be executed on every run of this role. (Only if 'type' in ['ad', 'ldap']!)
# } | list[dict={'realm': <realm>, …}]: (Declarative) PVE authentication realms ('domains').
pve_realms: {}
# pve_realms_sync_jobs -> list[dict={
#  'id' -> str: (Optional) Unique ID of this sync job.
#  'realm' -> str: (Required) Name of realm to sync.
#  'enabled' -> bool: (default=true) If this sync job is enabled.
#  'enable-new' -> bool:  (default=true) If newly synced users are enabled immediately.
#  'schedule' -> str: (Required) Execution schedule. The format is a subset of `systemd` calendar events.
#                                Examples:
#                                  - 'daily', 'weekly', 'monthly', 'yearly'
#                                  - '*/30' for every 30 minutes.
#                                  - '*/2:00' for every 2 hours.
#                                  - '21:00' for everyday 21:00.
#                                  - '2,22:30' for everyday 2:30 and 22:30.
#                                  - 'mon..fri 00:00' for Monday-Friday 00:00.
#                                  - 'mon..fri */1:00' for Monday-Friday hourly.
#                                  - 'mon..fri 7..18:00/15' for Monday-Friday 7:00-18:00 every 15 minutes.
#                                  - 'sat *-1..7 15:00' for first Saturday each month 15:00.
#  'comment' -> str: Description of this sync job.
#  'remove-vanished' -> str=Selection('[acl;][properties;][entry]', 'none'): (default='none')
#                       A semicolon-separated list of things to remove when they or the user vanishes during a sync.
#                       The following values are possible:
#                       'acl' removes acls when the user/group is not returned from the sync. Instead of a list it also can be 'none' (the default).
#                       'properties' removes the set properties on existing user/group that do not appear in the source (even custom ones).
#                       'entry' removes the user/group when not returned from the sync.
#  'scope' -> str=Selection('both', 'groups', 'users'): (Required) Select what to sync.
# }]: (Declarative) Define scheduled realm sync jobs that sync users and/or groups regularly.
pve_realm_sync_jobs: []
# pve_pools -> dict={
# <poolid> -> str: Resource pool name.
#  dict={
#   'comment' -> str: Resource pool comment.
#   'allow-move' -> bool: (default=false): Allow adding a guest even if already in another pool.
#                                          The guest will be removed from its current pool and added to this one.
#   'storage' -> list[str]: List of storage IDs/names to add or remove from this pool.
#   'vms' -> list[str]: List of guest VMIDs to add or remove from this pool.
#  }
# } | list[dict={'poolid': <poolid>, …}|str=<poolid>]: (Declarative) PVE (resource) pools.
pve_pools: {}
# pve_roles -> dict={
# <roleid> -> str=regex(^(?![pP][vV][eE]).*): Name/ID of the new role. (Must not start with 'pve'/'PVE')
#  dict={
#   'privs' -> list[str]: List of privileges. (see https://pve.proxmox.com/pve-docs/pveum.1.html#_privileges)
#  }
# } | list[dict={'roleid': <roleid>, …}|str=<roleid>]: (Declarative) Additional PVE roles.
pve_roles: {}
# pve_groups -> dict={
#  <groupid> -> str: Name/ID of the group.
#  dict={
#   'comment' -> str: Description of this group.
#  }
# } | list[dict={'groupid': <groupid>, …}|str=<groupid>]: (Declarative) PVE user groups.
pve_groups: {}
# pve_users -> dict={
# <userid> -> str: Full User ID, in the name@realm format.
# dict={
#   'comment' -> str: User comment or description.
#   'email' -> str: User e-mail address.
#   'enable' -> bool: (default=true) Enable the account (default). Set this to false to disable the account
#   'expire' -> int=range(0, inf): Account expiration date (seconds since epoch [1970-01-01]). 0 means no expiration date.
#   'firstname' -> str: User first name.
#   'lastname' -> str: User last name.
#   'groups' -> list[str]|str: Groups the user is member of.
#   'keys' -> str=regex[0-9a-zA-Z!=]{0,4096}: Keys for two-factor auth (yubico).
#   'password' -> str: Initial password. Ensure the authentication realm does exist and is writeable.
# TODO MW:
#   'token' -> dict={ # TODO WIP, NOT SUPPORTED
#     <tokenid> -> str: (Required) Token identifier.
#     {
#      'comment' -> str: Token description.
#      'expire' -> int: (default=<user.expire>) API token expiration date (seconds since epoch). '0' means no expiration date.
#      'privsep' -> bool: (default=true) Restrict API token privileges with separate ACLs (default), or give full privileges of corresponding user.
#      'file' -> str|FilePath: Where to store the token value.
#      'host' -> str|host: On which host to store the token value.
#     }
#   } | list[dict={'tokenid': <tokenid>, …}]: Define user-specific API token.
#  }
# } | list[dict={'userid': <userid>, …}|str=<userid>]: (Declarative) PVE users.
pve_users: {}
# pve_acls -> list[dict={
#  'path' -> str: (Required) Access control path. List of valid ACL paths in perl-regex style:
#                  (https://github.com/proxmox/pve-access-control/blob/25dd3756f90afbf65799da4708b3df9c2bf7e9f6/src/PVE/AccessControl.pm#L1258)
#  	               regex=('/                                                               (Everything)
#	                      |/access                                                         (Identity and Access)
#	                      |/access/groups                                                  (All PVE user groups)
#	                      |/access/groups/[[:alnum:]\.\-\_]+                               (Specific PVE user group)
#	                      |/access/realm                                                   (All PVE realms/'domains')
#	                      |/access/realm/[[:alnum:]\.\-\_]+                                (Specific PVE realm/'domain')
#	                      |/nodes                                                          (All PVE nodes)
#	                      |/nodes/[[:alnum:]\.\-\_]+                                       (Specific PVE cluster node)
#	                      |/pool                                                           (All PVE resource pools)
#	                      |/pool/[A-Za-z0-9\.\-_]+(?:/[A-Za-z0-9\.\-_]+){0,2}              (Specific PVE resource pool)
#	                      |/sdn                                                            (Full SDN access in cluster)
#	                      |/sdn/controllers                                                (...)
#	                      |/sdn/controllers/[[:alnum:]\_\-]+                               (...)
#	                      |/sdn/dns                                                        (...)
#	                      |/sdn/dns/[[:alnum:]]+                                           (...)
#	                      |/sdn/ipams                                                      (...)
#	                      |/sdn/ipams/[[:alnum:]]+                                         (...)
#	                      |/sdn/zones                                                      (All SDN zones in cluster)
#	                      |/sdn/zones/[[:alnum:]\.\-\_]+                                   (...)
#	                      |/sdn/zones/[[:alnum:]\.\-\_]+/[[:alnum:]\.\-\_]+                (...)
#	                      |/sdn/zones/[[:alnum:]\.\-\_]+/[[:alnum:]\.\-\_]+/[1-9][0-9]{0,3}(...)
#	                      |/storage                                                        (All PVE storages)
#	                      |/storage/[[:alnum:]\.\-\_]+                                     (Specific PVE storage)
#	                      |/vms                                                            (All VMs in cluster)
#	                      |/vms/[1-9][0-9]{2,}                                             (Specific VMID)
#	                      |/mapping                                                        (All mappings)
#	                      |/mapping/[[:alnum:]\.\-\_]+                                     (...)
#	                      |/mapping/[[:alnum:]\.\-\_]+/[[:alnum:]\.\-\_]+                  (...)
#                         ')
#  'groups' -> list[str]|str: (Any of 'users', 'roles', 'tokens' is required) List of groups to apply acl to.
#  'propagate' -> bool: (default=true) Allow to propagate (inherit) permissions.
#  'roles' -> list[str]|str: (Required) List of roles to apply acl to.
#  'tokens' -> list[str]|str: (Any of 'users', 'roles', 'tokens' is required) List of API tokens to apply acl to.
#  'users' -> list[str]|str: (Any of 'users', 'roles', 'tokens' is required) List of users to apply acl to.
# }]: (Declarative) PVE Access Control List settings.
pve_acls: []

# List of storages to manage in PVE. See section on Storage Management.
pve_metric_servers: []
pve_hooks: {}


### Security / Hardening
# pve_sysctl_conf -> dict={
#  <sysctl key> -> str: <sysctl key value> -> int: Mapping of sysctl config path to value.
# }: (Declarative) Custom sysctl configuration settings to apply on each host.
# Example: {"net.ipv6.conf.all.disable_ipv6": 1, …}
pve_sysctl_conf: {}
# pve_ksm_enabled -> bool: (Declarative) Toggle (PVE-) kernel same page merging.
pve_ksm_enabled: true


### PCIe Passthrough
# pve_pcie_passthrough_enabled -> bool: (Declarative) Same as pve_manage_pcie_passthrough.
pve_pcie_passthrough_enabled: false
# pve_manage_pcie_passthrough -> bool: (Declarative) Renamed from pve_pcie_passthrough_enabled.
pve_manage_pcie_passthrough: "{{ pve_pcie_passthrough_enabled }}"  # introducing pve_manage as prefix for reversible actions
pve_pci_device_ids: []
pve_iommu_passthrough_mode: false
pve_iommu_unsafe_interrupts: false
pve_mediated_devices_enabled: false
pve_pcie_ovmf_enabled: false
#pve_vfio_blacklist_drivers: []
pve_pcie_ignore_msrs: false
pve_pcie_report_msrs: true
### pve kernel modules
pve_vfio_modules: [vfio, vfio_iommu_type1, vfio_pci, vfio_virqfd]
pve_vfio_blacklist_modules: []
#   required vfio modules
pve_gvtg_modules: [kvmgt, mdev]


### Watchdog
pve_watchdog: null
pve_watchdog_ipmi_action: power_cycle
pve_watchdog_ipmi_timeout: 10


### Corosync Cluster
# TODO rename to 'pve_manage_cluster'
# pve_cluster_enabled -> bool: (Irreversible) If a PVE cluster consisting of all group hosts should get created.
#                                             NOTE: This requires "pve_cluster_addr0" to be set and correct.
pve_cluster_enabled: null
# pve_cluster_clustername -> str: (Irreversible) Name of the new cluster.
pve_cluster_clustername: "{{ pve_group }}"
# pve_cluster_initiator_host -> str|host: (Declarative)
#                           Host for initialization and node management of corosync and ceph clusters (if enabled).
pve_cluster_initiator_host: "{{ groups[pve_group][0] }}"
# pve_cluster_addr0 -> str|ipaddr: (Irreversible) Host's first IP address on Corosync network.
#                                  NOTE: Aliased by "corosync_ring0_ip: <host_ip_address>/<netmask>" host variable.
pve_cluster_addr0: "{{ ansible_default_ipv4.address if ansible_default_ipv4.address is defined
                       else ansible_default_ipv6.address if ansible_default_ipv6.address is defined }}"
# pve_cluster_addr1 -> Optional[false|str|ipaddr]: (Irreversible) Host's second IP address on Corosync network.
#                                  NOTE: Aliased by "corosync_ring1_ip: <host_ip_address>/<netmask>" host variable.
pve_cluster_addr1: null
# pve_cluster_addr0_priority -> Optional[int=range(0,inf)]: (Irreversible)
# Priority of hosts first interface on Corosync network, higher int = higher prio = used first
pve_cluster_addr0_priority: 100
# pve_cluster_addr1_priority -> Optional[int=range(0,inf)]: (Irreversible)
# Priority of hosts second interface on Corosync network, higher int = higher prio = used first
pve_cluster_addr1_priority: 50
# pve_cluster_ha_groups -> list[dict={
#  'name' -> str: (Required) Name of HA group.
#  'comment' -> str: (default="") Comment on HA group, defaults to "".
#  'nodes' -> list[str|host]: (default=groups[pve_group]) List of hostnames belonging to this HA group.
#                             Priority within the HA group can be defined by suffixing ':<priority>' to the hostnames. 
#                             Defaults to all hosts in pve_group.
#  'nofailback' -> bool: (default=false) The CRM tries to run services on the node with the highest priority.
#                         If a node with higher priority comes online, the CRM migrates the service to that node.
#                         Enabling 'nofailback' prevents that behavior.
#  'restricted' -> bool: (default=false) Resources bound to restricted groups may only run on nodes defined by the group.
# }]: (Declarative) List of HA groups to be created defined as dict,
# consisting of 'name' key and key-values used as arguments for ha-manager command.
pve_cluster_ha_groups: null
# pve_cluster_ha_init -> bool: Defines if the role takes care to start to start ha-manager crm + lrm
pve_cluster_ha_manager_init: true
# pve_datacenter_options -> dict={
#  'bwlimit' -> str='[clone=<LIMIT>][,default=<LIMIT>][,migration=<LIMIT>][,move=<LIMIT>][,restore=<LIMIT>]':
#                                                             Set I/O bandwidth limit for various operations (in KiB/s).
#  'consent-text' -> str: Consent text that is displayed before logging in.
#  'console' -> str=Selection('applet', 'vv', 'html5', 'xtermjs'): (default='xtermjs') Default Console viewer.
#                                                                  If the selected viewer is not available (e.g. SPICE not activated for the VM),
#                                                                  the fallback is noVNC.
#  'crs' -> str='[ha=<basic|static>][,ha-rebalance-on-start=<1|0>]': Cluster resource scheduling settings.
#  'description' -> str: Datacenter description. Shown in the web-interface datacenter notes panel.
#  'email_from' -> str: Specify email address to send notification from (default is root@$hostname)
#  'fencing' -> str=Selection('watchdog', 'hardware', 'both'): Set the fencing mode of the HA cluster.
#                            Hardware mode needs a valid configuration of fence devices in /etc/pve/ha/fence.cfg.
#                            With both all two modes are used. WARNING: 'hardware' and 'both' are EXPERIMENTAL & WIP
#  'ha' -> str='shutdown_policy=[freeze|failover|migrate|conditional]': (default='shutdown_policy=conditional') Cluster wide HA settings.
#  'http_proxy' -> str: http://.* Specify external http proxy which is used for downloads (example: 'http://username:password@host:port/')
#  'keyboard' -> str=Select('de', 'de-ch', 'da', 'en-gb', 'en-us', 'es', 'fi', 'fr', 'fr-be', 'fr-ca', 'fr-ch', 'hu', 'is',
#                           'it', 'ja', 'lt', 'mk', 'nl', 'no', 'pl', 'pt', 'pt-br', 'sv', 'sl', 'tr'): Default keybord layout for vnc server.
#  'language' -> str=Select('ar', 'ca', 'da', 'de', 'en', 'es', 'eu', 'fa', 'fr', 'hr', 'he', 'it', 'ja', 'ka', 'kr', 'nb',
#                           'nl', 'nn', 'pl', 'pt_BR', 'ru', 'sl', 'sv', 'tr', 'ukr', 'zh_CN', 'zh_TW'): Default GUI language.
#  'mac_prefix' -> str: (default='BC:24:11'): Prefix for the auto-generated MAC addresses of virtual guests.
#                                             The default `BC:24:11` is the Organizationally Unique Identifier (OUI) assigned by the IEEE
#                                             to Proxmox Server Solutions GmbH for a MAC Address Block Large (MA-L).
#                                             You're allowed to use this in local networks, i.e.,
#                                             those not directly reachable by the public (e.g., in a LAN or NAT/Masquerading).
#                                             Note that when you run multiple cluster that (partially) share the networks of their virtual guests,
#                                             it's highly recommended that you extend the default MAC prefix,
#                                             or generate a custom (valid) one, to reduce the chance of MAC collisions.
#                                             For example, add a separate extra hexadecimal to the Proxmox OUI for each cluster,
#                                             like `BC:24:11:0` for the first, `BC:24:11:1` for the second, and so on.
#  'max_workers' -> int=range(1,inf): Defines how many workers (per node) are maximally started on actions or tasks.
#  'migration' -> str='[type=]<secure|insecure>[,network=<CIDR>]: Cluster wide migration settings.
#  'next-id' -> str='[lower=<int=range(10,upper)>][,upper=<int=range(lower,inf)>]': Control the range for the free VMID pool.
#  'notify' -> str='[fencing=<always|never>][,package-updates=<auto|always|never>][,replication=<always|never>]
#                   [,target-fencing=<TARGET>][,target-package-updates=<TARGET>][,target-replication=<TARGET>]': Cluster-wide notification settings.
#  'registered-tags' -> str='<tag>[;<tag>[;<tag>[…]]]': A list of tags that require a `Sys.Modify` on '/' to set and delete.
#                                                       Tags set here that are also in 'user-tag-access' also require `Sys.Modify`.
#  'tag-style' -> str='[case-sensitive=<1|0>][,color-map=<tag>:<hex-color>[:<hex-color-for-text>][;<tag>=...]]
#                      [,ordering=<config|alphabetical>][,shape=<enum>]': Tag style options.
#  'user-tag-access' -> str='[user-allow=<enum>][,user-allow-list=<tag>[;<tag>...]]': Privilege options for user-settable tags.
#  'webauthn' -> str='[allow-subdomains=<1|0>][,id=<DOMAINNAME>][,origin=<URL>][,rp=<RELYING_PARTY>]': WebAuthn configuration.
# }: (Declarative) Custom PVE Datacenter options.
# Example: {"bwlimit": "default=1048576", "crs": "ha=basic,ha-rebalance-on-start=1", "ha": "shutdown_policy=migrate", …}
pve_datacenter_options: {}
# pve_datacenter_cfg -> dict: (Legacy) key-values for PVE datacenter options (datacenter.cfg).
pve_datacenter_cfg: "{{ pve_datacenter_options }}"

### PVE Storage definitions
# pve_storages -> dict={
# 'storage' -> str: Storage ID.
# 'type' -> str=Selection('btrfs', 'cephfs', 'cifs', 'dir', 'esxi', 'glusterfs', 'iscsi', 'iscsidirect', 'lvm',
#                         'lvmthin', 'nfs', 'pbs', 'rbd', 'zfs', 'zfspool'): Storage type.
#
# 'authsupported' -> str: Auth supported.
# 'base' -> str: Base volume. This volume is automatically activated.
# 'blocksize' -> str: block size
# 'bwlimit' -> str='[clone=<LIMIT>][,default=<LIMIT>][,migration=<LIMIT>][,move=<LIMIT>][,restore=<LIMIT>]':
#                                                             Set I/O bandwidth limit for various operations (in KiB/s).
# 'comstar_hg' -> str: host group for comstar views
# 'comstar_tg' -> str: target group for comstar views
# 'content' -> list[str]|str=AnyOf('images', 'rootdir', 'vztmpl', 'backup', 'iso', 'snippets', 'import'):
#                                                          (Comma separated) List of allowed content types.
#                                                          NOTE: 'rootdir' is used for Containers, and 'images' for VMs.
# 'content-dirs' -> list[str]|str: Overrides for default content type directories.
# 'create-base-path' -> bool: (default=true) Create the base directory if it doesn’t exist.
# 'create-subdirs' -> bool: (default=true) Populate the directory with the default structure.
# 'data-pool' -> str: Data Pool (for erasure coding only)
# 'datastore' -> str: Proxmox Backup Server datastore name.
# 'disable' -> bool: Flag to disable the storage.
# 'domain' -> str: CIFS domain.
# 'encryption-key' -> str: A file containing an encryption key, or the special value 'autogen'.
#                         Encryption key. Use 'autogen' to generate one automatically without passphrase.
# 'export' -> str: NFS export path.
# 'fingerprint' -> str=regex('[A-Fa-f0-9]{2}:){31}[A-Fa-f0-9]{2}'): Certificate SHA 256 fingerprint.
# 'format' -> str=Selection('qcow2', 'raw', 'subvol', 'vmdk'): Default image format.
# 'fs-name' -> str: The Ceph filesystem name.
# 'fuse' -> bool: Mount CephFS through FUSE.
# 'is_mountpoint' -> str=Selection('yes', 'no'): (default='no') Assume the given path is an externally managed mountpoint
#                                                and consider the storage offline if it is not mounted. Using a boolean (yes/no)
#                                                value serves as a shortcut to using the target path in this field.
# 'iscsiprovider' -> str: iscsi provider
# 'keyring' -> str: Client keyring contents (for external clusters) to authenticate in the Ceph cluster.
# 'krbd' -> bool: (default=false) Always access rbd through krbd kernel module.
# 'lio_tpg' -> str: target portal group for Linux LIO targets
# 'master-pubkey' -> str: Base64-encoded, PEM-formatted public RSA key.
#                         Used to encrypt a copy of the encryption-key which will be added to each encrypted backup.
# 'max-protected-backups' -> int=range(-1, N): (default = Unlimited for users with 'Datastore.Allocate' privilege, 5 for other users)
#                                              Maximal number of protected backups per guest. Use -1 for unlimited.
# 'monhost' -> str: IP addresses of monitors (for external clusters).
# 'mountpoint' -> str: mount point
# 'namespace' -> str: Namespace.
# 'nocow' -> bool: (default=false) Set the NOCOW flag on files.
#                                  Disables data checksumming and causes data errors to be unrecoverable from while allowing direct I/O.
#                                  Only use this if data does not need to be any more safe than on a single ext4 formatted disk with no underlying raid system.
# 'nodes' -> str: List of nodes for which the storage configuration applies.
# 'nowritecache' -> bool: Disable write caching on the target.
# 'options' -> str: NFS/CIFS mount options (see man nfs or man mount.cifs)
# 'password' -> str: Password for accessing the share/datastore.
# 'path' -> str: File system path.
# 'pool' -> str: Pool.
# 'port' -> int=range(1, 65535): Use this port to connect to the storage instead of the default one (for example, with PBS or ESXi).
#                                For NFS and CIFS, use the options option to configure the port via the mount options.
# 'portal' -> str: iSCSI portal (IP or DNS name with optional port).
# 'preallocation' -> str=Selection('falloc', 'full', 'metadata', 'off'): (default='metadata') Preallocation mode for raw and qcow2 images.
#                                                                        Using 'metadata' on raw images results in preallocation='off'.
# 'prune-backups' -> str='[keep-all=<1|0>][,keep-daily=<N>][,keep-hourly=<N>][,keep-last=<N>][,keep-monthly=<N>][,keep-weekly=<N>][,keep-yearly=<N>]':
#                         The retention options with shorter intervals are processed first with --keep-last being the very first one.
#                         Each option covers a specific period of time. We say that backups within this period are covered by this option.
#                         The next option does not take care of already covered backups and only considers older backups.
# 'saferemove' -> bool: Zero-out data when removing LVs.
# 'saferemove_throughput' -> str: Wipe throughput (cstream -t parameter value).
# 'server' -> str: Server IP or DNS name.
# 'server2' -> str: Backup volfile server IP or DNS name.
#    Note 	Requires option(s): server
# 'share' -> str: CIFS share.
# 'shared' -> bool: Indicate that this is a single storage with the same contents on all nodes (or all listed in the 'nodes' option)
#                   It will not make the contents of a local storage automatically accessible to other nodes, it just marks an already shared storage as such!
# 'skip-cert-verification' -> bool: (default=false) Disable TLS certificate verification, only enable on fully trusted networks!
# 'smbversion' -> str=Selection('2.0', '2.1', '3', '3.0', '3.11', 'default'): (default='default') SMB protocol version.
#                               'default' negotiates the highest SMB2+ version supported by both the client and server.
# 'sparse' -> bool: use sparse volumes
# 'subdir' -> str: Subdir to mount.
# 'tagged_only' -> bool: Only use logical volumes tagged with pve-vm-ID.
# 'target' -> str: iSCSI target.
# 'thinpool' -> str: LVM thin pool LV name.
# 'transport' -> str=Selection('rdma', 'tcp', 'unix'): Gluster transport: tcp or rdma
# 'username' -> str: RBD Id.
# 'vgname' -> str: Volume group name.
# 'volume' -> str: Glusterfs Volume.
# } | list[dict={'storage': <storage>, …}]: (Declarative) PVE Storage definitions making physical storages available to PVE.
#                                   NOTICE: Storage definitions are mappings between real/physical storage and PVE itself,
#                                   telling PVE how to access the physical storage. Storage declared here is never created or initialized!
pve_storages: []

